<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="وصل صيانة — BN SMART"><meta property="og:description" content="وصل استلام جهاز للصيانة — BN SMART"><meta property="og:image" content="/logo.png?v=23"><title>وصل الصيانة — BN SMART</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f1f1f1;color:#111;font-family:Arial,Tahoma,sans-serif}body{padding:14px}.wrap{width:100%;max-width:680px;margin:0 auto}.receipt{background:#fff;padding:22px 24px;box-shadow:0 8px 30px #0001}.actions{display:flex;gap:8px;margin-bottom:12px}.actions button{flex:1;border:0;border-radius:7px;padding:11px;font:inherit;cursor:pointer}.back{background:#eee}.print{background:#e3262e;color:#fff}.header{text-align:center;border-bottom:2px solid #e3262e;padding-bottom:10px;margin-bottom:7px}.header img{display:block;width:300px;height:82px;object-fit:contain;margin:0 auto 2px}.brand{font-size:22px;font-weight:800;line-height:1.1}.title{font-size:17px;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px dashed #cfd2d6;min-height:38px}.label{font-size:16px;font-weight:600}.value{font-size:16px;font-weight:800;text-align:left;direction:ltr;unicode-bidi:plaintext;max-width:65%;word-break:break-word}.box{border:1px solid #d8dce0;border-radius:10px;padding:13px 14px;margin-top:10px}.box h3{font-size:18px;margin:0 0 8px;font-weight:800}.box .text{font-size:16px;min-height:24px}.bottom-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;margin-top:11px;direction:ltr}.qrbox,.moneybox{border:1px solid #d8dce0;border-radius:10px;padding:10px;direction:rtl}.qrbox{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.qrbox img{width:120px;height:120px;display:block}.qrbox .code{font-weight:800;font-size:16px;margin-top:5px;direction:ltr}.qrbox small{font-size:13px;margin-top:4px}.moneybox{background:#fff5f5;border-color:#efb8b8}.money-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:7px;padding:9px 11px;margin:5px 0;font-size:16px}.money-row b{font-size:17px}.terms{border:1px solid #d8dce0;border-radius:10px;padding:10px 13px;margin-top:11px;font-size:13px;line-height:1.75}.terms div{position:relative;padding-right:13px;margin:2px 0}.terms div:before{content:'•';position:absolute;right:0;color:#e3262e;font-weight:900}.thanks{text-align:center;font-weight:800;font-size:20px;margin-top:13px;padding-top:10px;border-top:2px solid #e3262e}.thanks:before,.thanks:after{content:'ــــــــــــ';color:#e3262e;font-size:10px;margin:0 10px}
@media(max-width:520px){body{padding:5px}.receipt{padding:12px}.header img{width:250px;height:70px}.brand{font-size:20px}.title{font-size:15px}.label,.value{font-size:14px}.box h3{font-size:16px}.box .text{font-size:14px}.bottom-grid{grid-template-columns:1fr 1.12fr}.qrbox img{width:105px;height:105px}.money-row{font-size:14px}.money-row b{font-size:15px}.terms{font-size:11px}.thanks{font-size:17px}.thanks:before,.thanks:after{margin:0 4px}}
@media print{@page{size:105mm 148mm;margin:0}html,body{background:#fff;padding:0}.wrap{width:105mm;max-width:none;margin:0}.receipt{width:105mm;min-height:148mm;padding:4.5mm;box-shadow:none}.actions{display:none}.header{padding-bottom:2.5mm;margin-bottom:1mm}.header img{width:53mm;height:21mm;margin:0 auto}.brand{font-size:17px}.title{font-size:12px;margin-top:1mm}.row{padding:2.1mm 1mm;min-height:7.5mm}.label,.value{font-size:10.5px}.box{padding:3mm 3.4mm;margin-top:2.1mm;border-radius:3mm}.box h3{font-size:11.5px;margin-bottom:1.5mm}.box .text{font-size:10px;min-height:6mm}.bottom-grid{gap:3mm;margin-top:2.3mm}.qrbox,.moneybox{padding:2.8mm;border-radius:3mm}.qrbox img{width:25mm;height:25mm}.qrbox .code{font-size:10px;margin-top:1mm}.qrbox small{font-size:8px}.money-row{padding:2mm 2.3mm;margin:1.3mm 0;font-size:10px}.money-row b{font-size:10.5px}.terms{padding:2.7mm 3.2mm;margin-top:2.3mm;font-size:8.2px;line-height:1.6}.thanks{font-size:12.5px;margin-top:3mm;padding-top:2.2mm}.thanks:before,.thanks:after{font-size:8px;margin:0 2mm}}
</style></head><body><div class="wrap"><div class="receipt"><div class="actions"><button class="back" onclick="goBack()">← العودة</button><button class="print" onclick="window.print()">🖨️ طباعة الوصل</button></div><div class="header"><img src="/logo.png?v=23" alt="BN SMART"><div class="brand">BN SMART</div><div class="title">وصل استلام جهاز للصيانة</div></div><div id="app">جاري تحميل الوصل...</div></div></div>
<script>
function goBack(){if(history.length>1)history.back();else location.href="/"}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
const code=decodeURIComponent(location.pathname.split('/').pop());
fetch('/api/track/'+encodeURIComponent(code),{cache:'no-store'}).then(r=>r.json()).then(x=>{if(x.error)throw Error(x.error);const q='/api/qr/'+encodeURIComponent(x.tracking_code)+'?v=20';const remaining=Math.max(0,Number(x.expected_price||0)-Number(x.paid_amount||0));const acc=(x.accessories||[]).join('، ')||'لا يوجد';document.getElementById('app').innerHTML=`
<div class="row"><span class="label">رقم الوصل</span><b class="value">#${esc(x.receipt_no)}</b></div>
<div class="row"><span class="label">العميل</span><b class="value">${esc(x.customer_name||'—')}</b></div>
<div class="row"><span class="label">الهاتف</span><b class="value">${esc(x.customer_phone||'—')}</b></div>
<div class="row"><span class="label">الجهاز</span><b class="value">${esc(x.device||'—')}</b></div>
<div class="box"><h3>العطل</h3><div class="text">${esc(x.fault||'—')}</div></div>
<div class="box"><h3>الملحقات المستلمة</h3><div class="text">${esc(acc)}</div></div>
<div class="bottom-grid"><div class="qrbox"><img src="${q}" alt="QR"><div class="code">${esc(x.tracking_code)}</div><small>امسح الرمز لمتابعة حالة جهازك</small></div><div class="moneybox"><div class="money-row"><span>السعر</span><b>${Number(x.expected_price||0).toLocaleString('ar-DZ')} دج</b></div><div class="money-row"><span>المدفوع</span><b>${Number(x.paid_amount||0).toLocaleString('ar-DZ')} دج</b></div><div class="money-row"><span>المتبقي</span><b>${remaining.toLocaleString('ar-DZ')} دج</b></div></div></div>
<div class="terms"><div>المحل غير مسؤول عن الجهاز بعد مدة أقصاها شهر من تاريخ جاهزية الجهاز للتسليم.</div><div>في حال تعرض الهاتف لسقوط في الماء، المحل غير مسؤول عن أي أعطال أو نتائج قد تظهر بعد التصليح.</div><div>الضمان لمدة 24 ساعة على الشاشة الأصلية فقط.</div><div>الشاشات العادية والمقلدة لا يوجد ضمان عليها.</div></div>
<div class="thanks">شكراً لثقتكم... ونسعد دائماً بخدمتكم</div>`}).catch(e=>document.getElementById('app').innerHTML='<h3>لا يمكن العثور على الوصل</h3>');
</script></body></html>
