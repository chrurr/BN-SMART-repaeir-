<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع جهازك — BN SMART</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo;background:#f5f5f6;margin:0;padding:30px}.box{max-width:650px;margin:auto;background:#fff;border:1px solid #eee;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0000000d}.logo{width:min(260px,80vw);height:auto;max-height:90px;object-fit:contain;display:block;margin:auto}.center{text-align:center}.badge{display:inline-block;padding:7px 12px;border-radius:99px;background:#def7e8;color:#147642;font-weight:700}.step{padding:12px;border-right:3px solid #ddd;margin:8px 0}.done{border-color:#159957}</style></head><body><div class="box"><img class="logo" src="/logo.png?v=23"><h1 class="center">BN SMART — تتبع جهازك</h1><div id="app">جاري التحميل...</div></div><script>
const code=decodeURIComponent(location.pathname.split('/').pop());
fetch('/api/track/'+encodeURIComponent(code)).then(r=>r.json()).then(x=>{if(x.error)throw Error(x.error);document.getElementById('app').innerHTML=`<p>وصل رقم: <b>#${x.receipt_no}</b></p><h2>📱 ${x.device||'جهاز'}</h2><p>العطل: ${x.fault||'—'}</p><p class="badge">${x.status}</p><h3>آخر تحديث</h3><p>${new Date(x.updated_at).toLocaleString('ar-DZ')}</p><h3>المراحل</h3>${x.history.map(h=>`<div class="step done">✓ ${h.status}<br><small>${new Date(h.created_at).toLocaleString('ar-DZ')}</small></div>`).join('')}`}).catch(e=>document.getElementById('app').innerHTML='<h3>رقم التتبع غير موجود</h3>');
</script></body></html>
