name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bn
          POSTGRES_PASSWORD: bn
          POSTGRES_DB: bn_smart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bn:bn@localhost:5432/bn_smart
      JWT_SECRET: ci-test-secret-ci-test-secret
      DEFAULT_ADMIN_PASSWORD: Admin@12345
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node --check server.js
      - run: npm test
      - run: npm audit --audit-level=high
